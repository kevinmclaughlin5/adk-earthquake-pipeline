<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthquake Activity Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --ink:#1f2933; --muted:#616e7c; --line:#e4e7eb; --accent:#2f6fb3; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { margin:0 0 4px; font-size: 26px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi, .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .value { font-size:26px; font-weight:600; margin-top:4px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .full { grid-column: 1 / -1; }
  table { width:100%; border-collapse: collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  footer { color:var(--muted); font-size:12px; margin-top:20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Earthquake Activity Report</h1>
  <p class="sub" id="subtitle"></p>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card"><h2>Top 10 regions by event count</h2><canvas id="regionChart" height="260"></canvas></div>
    <div class="card"><h2>Events by magnitude band</h2><canvas id="bandChart" height="260"></canvas></div>
    <div class="card full"><h2>Events per day (UTC)</h2><canvas id="dailyChart" height="110"></canvas></div>
    <div class="card full">
      <h2>10 strongest events</h2>
      <table>
        <thead><tr><th>Time (UTC)</th><th>Location</th><th class="num">Magnitude</th><th class="num">Depth (km)</th></tr></thead>
        <tbody id="strongest"></tbody>
      </table>
    </div>
  </section>

  <footer>Source: USGS Earthquake Hazards Program API. Generated by an ADK agent pipeline.</footer>
</main>

<script>
(() => {
const S = __SUMMARY_JSON__;
const ACCENT = "#2f6fb3";

document.getElementById("subtitle").textContent =
  `Last ${S.params.days} day(s), magnitude ≥ ${S.params.min_magnitude} · generated ${new Date(S.generated_at).toLocaleString()}`;

const kpis = [
  ["Earthquakes", S.total_events.toLocaleString()],
  ["Regions", S.regions_count],
  ["Avg magnitude", S.avg_magnitude],
  ["Max magnitude", S.max_magnitude],
  ["Tsunami flags", S.tsunami_flagged],
  ["Records filtered out", S.dropped_records],
];
document.getElementById("kpis").innerHTML = kpis
  .map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");

const baseOpts = { plugins: { legend: { display: false } }, maintainAspectRatio: true };
const topRegions = S.region_stats.slice(0, 10);

new Chart(document.getElementById("regionChart"), {
  type: "bar",
  data: { labels: topRegions.map(r => r.region), datasets: [{ data: topRegions.map(r => r.count), backgroundColor: ACCENT, borderRadius: 4 }] },
  options: { ...baseOpts, indexAxis: "y",
    plugins: { legend: { display: false }, tooltip: { callbacks: {
      afterLabel: c => `avg mag ${topRegions[c.dataIndex].avg_magnitude} · max ${topRegions[c.dataIndex].max_magnitude}` } } } },
});

new Chart(document.getElementById("bandChart"), {
  type: "bar",
  data: { labels: Object.keys(S.magnitude_bands), datasets: [{ data: Object.values(S.magnitude_bands), backgroundColor: ACCENT, borderRadius: 4 }] },
  options: baseOpts,
});

new Chart(document.getElementById("dailyChart"), {
  type: "line",
  data: { labels: Object.keys(S.daily_counts),
    datasets: [{ data: Object.values(S.daily_counts), borderColor: ACCENT, backgroundColor: ACCENT, tension: 0.25, pointRadius: 3 }] },
  options: baseOpts,
});

document.getElementById("strongest").innerHTML = S.strongest_events.map(e => `
  <tr>
    <td>${e.time_utc.replace("T", " ").slice(0, 16)}</td>
    <td><a href="${e.url}" target="_blank" rel="noopener">${e.place}</a></td>
    <td class="num">${e.magnitude}</td>
    <td class="num">${e.depth_km ?? "–"}</td>
  </tr>`).join("");
})();
</script>
</body>
</html>
